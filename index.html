<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arshaan Khan — GTM Engineer</title><meta name="description" content="Arshaan Khan — GTM Engineer building signal-led revenue systems."><meta name="theme-color" content="#edf2f4"><style>html,body{margin:0;background:#edf2f4;font-family:system-ui,-apple-system,sans-serif}body{min-height:100vh;display:grid;place-items:center;color:#2b2d42}.loading{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.58}.error{padding:32px;max-width:680px}</style></head><body><div class="loading">Loading portfolio…</div><script>(async()=>{try{const parts=await Promise.all(Array.from({length:5},(_,i)=>fetch(`gtm/p${String(i+1).padStart(2,'0')}.txt`,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(`part ${i+1}: ${r.status}`);return r.text()})));const bin=atob(parts.join(''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('This browser does not support gzip decompression.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<main class="error"><h1>Portfolio failed to load.</h1><p>Please refresh the page or open it in a current browser.</p></main>'}})();</script></body></html>
